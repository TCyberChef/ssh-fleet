[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-fleet"
version = "0.1.0"
description = "Multi-machine SSH MCP server for Claude Code"
requires-python = ">=3.9"
dependencies = [
    "paramiko>=3.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
ssh-fleet = "ssh_fleet.server:main"
